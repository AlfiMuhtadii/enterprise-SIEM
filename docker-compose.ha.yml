# ENTERPRISE-073 — Redpanda Multi-Node HA Template
#
# Three-broker Redpanda cluster for production-grade HA deployments.
# This file is a TEMPLATE — adjust advertise addresses for your actual host IPs.
#
# Usage:
#   docker compose -f docker-compose.ha.yml up -d
#
# After startup, bootstrap topics with replication:
#   python scripts/xdr_topic_bootstrap.py --replication-factor 3
#
# See: docs/operations/REDPANDA_HA_RUNBOOK.md

services:

  # ---------------------------------------------------------------------------
  # Redpanda broker-0 (seed node / controller)
  # ---------------------------------------------------------------------------
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: xdr-redpanda-0
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "2"
      - --memory
      - "2G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-0:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda-0:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda-0:33145
      - --seeds
      - redpanda-0:33145+0
    ports:
      - "19092:9092"
      - "18082:8082"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9644/v1/brokers >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - xdr-ha
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # Redpanda broker-1
  # ---------------------------------------------------------------------------
  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: xdr-redpanda-1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "2"
      - --memory
      - "2G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "1"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-1:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda-1:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda-1:33145
      - --seeds
      - redpanda-0:33145+0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9644/v1/brokers >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - xdr-ha
    depends_on:
      redpanda-0:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # Redpanda broker-2
  # ---------------------------------------------------------------------------
  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: xdr-redpanda-2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "2"
      - --memory
      - "2G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "2"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-2:9092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda-2:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda-2:33145
      - --seeds
      - redpanda-0:33145+0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9644/v1/brokers >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - xdr-ha
    depends_on:
      redpanda-0:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # Redpanda Console — points to all three brokers
  # ---------------------------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.5
    container_name: xdr-redpanda-console
    environment:
      KAFKA_BROKERS: "redpanda-0:9092,redpanda-1:9092,redpanda-2:9092"
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - xdr-ha
    depends_on:
      redpanda-0:
        condition: service_healthy

networks:
  xdr-ha:
    driver: bridge
