services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: detector-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://127.0.0.1:19092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - 127.0.0.1:8082
    ports:
      - "19092:19092"
      - "9644:9644"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.5
    container_name: detector-redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: detector-soc-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-detector}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - detector_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-detector}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: detector-clickhouse
    environment:
      CLICKHOUSE_DB: detector_analytics
      CLICKHOUSE_USER: detector
      CLICKHOUSE_PASSWORD: detector
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - detector_clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: detector-grafana
    depends_on:
      - clickhouse
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./infra/analytics/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/analytics/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: detector-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "DetectorAdmin123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - detector_opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: detector-qdrant
    volumes:
      - detector_qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6333/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-app
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: database
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-queue
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: database
      DB_HOST: postgres
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-scheduler
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  telemetry-worker:
    build:
      context: .
      dockerfile: infra/telemetry-worker/Dockerfile
    container_name: detector-telemetry-worker
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      SECURITY_INGEST_DSN: "host=postgres port=${DB_PORT:-5432} dbname=${DB_DATABASE:-detector} user=${DB_USERNAME:-postgres} password=${DB_PASSWORD:-postgres}"
    command: ["python3", "scripts/telemetry_stream_worker.py", "--topic", "telemetry.raw", "--bootstrap-servers", "redpanda:9092"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -m py_compile scripts/telemetry_stream_worker.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ingestion-gateway:
    build:
      context: ./services/ingestion-gateway
    container_name: detector-xdr-ingestion-gateway
    profiles: ["strangler"]
    environment:
      XDR_REDPANDA_REST_URL: ${XDR_REDPANDA_REST_URL:-http://redpanda:8082}
      XDR_INGEST_SECRET: ${XDR_INGEST_SECRET:-dev-secret-change-me}
      XDR_RAW_TOPIC: telemetry.raw
      XDR_INGEST_RPS: 100
      XDR_MAX_BATCH_SIZE: 1000
      XDR_NORMALIZER_METRICS_URL: http://normalizer-worker:8092/metrics
      XDR_MAX_NORMALIZER_QUEUE_DEPTH: 150000
    ports:
      - "8091:8091"
    depends_on:
      - redpanda
    restart: unless-stopped

  normalizer-worker:
    build:
      context: ./services/normalizer-worker
    container_name: detector-xdr-normalizer-worker
    profiles: ["strangler"]
    environment:
      XDR_REDPANDA_REST_URL: ${XDR_REDPANDA_REST_URL:-http://redpanda:8082}
      XDR_RAW_TOPIC: telemetry.raw
      XDR_NORMALIZED_TOPIC: telemetry.normalized
      XDR_NORMALIZER_DLQ_TOPIC: telemetry.normalization_failed
      XDR_NORMALIZER_GROUP: ${XDR_NORMALIZER_GROUP:-normalizer-worker-v1}
      XDR_NORMALIZER_QUEUE_DEPTH: 200000
      XDR_NORMALIZER_PRODUCER_BATCH: 100
      XDR_NORMALIZER_PRODUCERS: 16
      XDR_NORMALIZER_WORKERS: 8
      XDR_NORMALIZER_FLUSH_MS: 50
    ports:
      - "8092:8092"
    depends_on:
      - redpanda
    restart: unless-stopped

  correlation-worker:
    build:
      context: ./services/correlation-worker
    container_name: detector-xdr-correlation-worker
    profiles: ["strangler"]
    environment:
      XDR_CORRELATION_MODE: shadow
      XDR_CORRELATION_GOGC: "300"
      XDR_REDPANDA_REST_URL: ${XDR_REDPANDA_REST_URL:-http://redpanda:8082}
      XDR_NORMALIZED_TOPIC: telemetry.normalized
      XDR_ALERTS_TOPIC: xdr.alerts
      XDR_CORRELATION_DLQ_TOPIC: xdr.alerts.dlq
      XDR_CORRELATION_GROUP: ${XDR_CORRELATION_GROUP:-correlation-worker-v1}
      XDR_CORRELATION_SCOPE: ${XDR_CORRELATION_SCOPE:-identity-cloud}
      XDR_CORRELATION_EVENT_LOOP_ENABLED: "true"
    ports:
      - "8093:8093"
    depends_on:
      - redpanda
    restart: unless-stopped

  ai-rag-service:
    build:
      context: ./services/ai-rag-service
    container_name: detector-xdr-ai-rag-service
    profiles: ["strangler"]
    ports:
      - "8094:8094"
    depends_on:
      - qdrant
    restart: unless-stopped

  alert-writer-service:
    build:
      context: ./services/alert-writer-service
    container_name: detector-xdr-alert-writer
    profiles: ["strangler"]
    env_file:
      - ./.env
    environment:
      SECURITY_INGEST_DSN: ${SECURITY_INGEST_DSN:-}
      DB_HOST: ${XDR_DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-detector}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      XDR_OPENSEARCH_URL: ${XDR_OPENSEARCH_URL:-http://opensearch:9200}
      XDR_REDPANDA_REST_URL: ${XDR_REDPANDA_REST_URL:-http://redpanda:8082}
      XDR_ALERTS_TOPIC: xdr.alerts
      XDR_ALERTS_CREATED_TOPIC: alerts.created
      XDR_ALERTS_DLQ_TOPIC: xdr.alerts.dlq
      XDR_ALERT_WRITER_GROUP: alert-writer-v1
      XDR_EVENT_LOOP_ENABLED: "true"
      XDR_ALERT_WRITER_AUTO_OFFSET_RESET: ${XDR_ALERT_WRITER_AUTO_OFFSET_RESET:-earliest}
    ports:
      - "8095:8095"
    depends_on:
      - redpanda
      - postgres
      - opensearch
    restart: unless-stopped

  incident-builder-service:
    build:
      context: ./services/incident-builder-service
    container_name: detector-xdr-incident-builder
    profiles: ["strangler"]
    env_file:
      - ./.env
    environment:
      SECURITY_INGEST_DSN: ${SECURITY_INGEST_DSN:-}
      DB_HOST: ${XDR_DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-detector}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      XDR_REDPANDA_REST_URL: ${XDR_REDPANDA_REST_URL:-http://redpanda:8082}
      XDR_ALERTS_CREATED_TOPIC: alerts.created
      XDR_INCIDENTS_TOPIC: incidents.updated
      XDR_INCIDENT_BUILDER_GROUP: incident-builder-v1
      XDR_EVENT_LOOP_ENABLED: "true"
      XDR_INCIDENT_BUILDER_AUTO_OFFSET_RESET: ${XDR_INCIDENT_BUILDER_AUTO_OFFSET_RESET:-earliest}
    ports:
      - "8096:8096"
    depends_on:
      - redpanda
      - postgres
    restart: unless-stopped

volumes:
  detector_pgdata:
  detector_clickhouse_data:
  detector_opensearch_data:
  detector_qdrant_data:
