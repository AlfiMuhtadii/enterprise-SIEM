services:
  # ENT-SEC-NO-TLS-INTERNAL (phase 8): seeds the named volumes redpanda's
  # pandaproxy TLS config/certs live in. A plain bind mount of a single file
  # into /etc/redpanda doesn't work here -- `rpk` needs to write a merged
  # temp config into that same directory at startup, and Docker Desktop's
  # Windows-host bind-mount layer doesn't support the chown that requires
  # (confirmed directly: "operation not permitted" / "permission denied" on
  # a bind mount; a named volume seeded once via this init step works fine).
  # One-shot: runs once per `docker compose up`, exits, redpanda depends on
  # its completion.
  #
  # Deliberately conditional on the certs actually existing (confirmed live:
  # pandaproxy_api_tls with enabled:true and a missing cert_file crashes the
  # ENTIRE broker at startup -- "Failure during startup: Could not read
  # certificate file" -- not just that one listener). So: certs present ->
  # copy the real TLS-enabled redpanda.yaml. Certs absent (fresh clone that
  # hasn't run `python scripts/xdr_generate_internal_mtls_certs.py
  # --generate` yet) -> write NO config file at all, leaving /etc/redpanda
  # empty. Confirmed live that an empty /etc/redpanda is byte-for-byte
  # equivalent to today's behavior (no config file ever existed before this
  # change) -- redpanda starts from CLI flags alone exactly as before, no
  # TLS listener, no crash, zero behavior change for anyone who hasn't
  # opted in.
  redpanda-config-init:
    image: alpine:3.20
    container_name: detector-redpanda-config-init
    volumes:
      - detector_redpanda_config:/cfg
      - detector_redpanda_certs:/certs
      - ./infra/redpanda/redpanda.yaml:/src/redpanda.yaml:ro
      - ./storage/certs/internal-mtls:/src/certs:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /src/certs/server.crt ]; then
          cp /src/certs/server.crt /src/certs/server.key /certs/
          chown -R 101:101 /certs
          cp /src/redpanda.yaml /cfg/redpanda.yaml
          chown -R 101:101 /cfg
        fi
    restart: "no"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: detector-redpanda
    depends_on:
      redpanda-config-init:
        condition: service_completed_successfully
    volumes:
      - detector_redpanda_config:/etc/redpanda
      - detector_redpanda_certs:/etc/redpanda-certs:ro
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092,INTERNAL_TLS://0.0.0.0:9093,OUTSIDE_TLS://0.0.0.0:19093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://127.0.0.1:19092,INTERNAL_TLS://redpanda:9093,OUTSIDE_TLS://127.0.0.1:19093
    ports:
      - "19092:19092"
      - "127.0.0.1:19093:19093"
      - "9644:9644"
      # Pandaproxy REST API — unauthenticated, internal-only boundary.
      # Exposed on 127.0.0.1 for local demo only. Remove or firewall in non-local deployments.
      - "127.0.0.1:8082:8082"
      # ENT-SEC-NO-TLS-INTERNAL: opt-in TLS listener (infra/redpanda/redpanda.yaml,
      # pandaproxy_api_tls, require_client_auth: false -- server-side TLS only).
      # Additive: 8082 above keeps working unchanged for every current REST
      # consumer. Only actually comes up once storage/certs/internal-mtls/
      # exists (python scripts/xdr_generate_internal_mtls_certs.py --generate)
      # -- redpanda-config-init above only writes the TLS config once certs
      # are present; until then this port is simply undefined (no listener,
      # nothing bound) and the broker starts exactly as it always has.
      - "127.0.0.1:8083:8083"
    healthcheck:
      # Admin HTTP API (port 9644) is more reliable than rpk under consumer reconnect storms.
      # rpk cluster health triggers a full metadata fetch which can timeout when Pandaproxy is busy.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9644/v1/brokers >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: '1.5'

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.5
    container_name: detector-redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: detector-soc-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-detector}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - detector_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-detector}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: detector-clickhouse
    environment:
      CLICKHOUSE_DB: detector_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-detector}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-detector}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - detector_clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: '2.0'

  # OBS-OTEL-TRACING: real OTel collector for the OTLP/HTTP spans already
  # emitted by all 6 hops (3 Go pipeline services, 2 Python services,
  # Laravel SOC control plane), off by default -- opt in with
  # `docker compose --profile observability up -d tempo`, then point
  # XDR_OTEL_EXPORTER_ENDPOINT at http://tempo:4318/v1/traces (container
  # network) or http://127.0.0.1:4318/v1/traces (host). Single-binary,
  # local-disk storage only (infra/analytics/tempo/tempo.yaml) -- a
  # verification/demo trace store, not a production retention story.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: detector-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/analytics/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - detector_tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: detector-grafana
    depends_on:
      - clickhouse
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./infra/analytics/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/analytics/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: detector-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-DetectorAdmin123!}"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - detector_opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: '1.5'

  # ENT-SEC-NO-TLS-INTERNAL (phase 8): OpenSearch's HTTP TLS is owned
  # entirely by the security plugin, and a single node cannot serve HTTP and
  # HTTPS on the same port at once -- confirmed via research, not assumed:
  # there is no per-listener mixed mode the way Pandaproxy's REST proxy
  # supports (see redpanda-config-init above). Flipping the LIVE `opensearch`
  # service to TLS would therefore be an instant breaking cutover for every
  # current plaintext consumer (Laravel's `Http::` calls, alert-writer's
  # index writes) with no transition window. Rather than force that, this is
  # a genuinely separate, opt-in second node -- a real, independently
  # verified TLS-enabled OpenSearch an operator can adopt on their own
  # timeline, without the live default ever being touched.
  opensearch-tls-certs-init:
    image: alpine:3.20
    container_name: detector-opensearch-tls-certs-init
    profiles: ["security"]
    volumes:
      - detector_opensearch_tls_certs:/certs
      - ./storage/certs/internal-mtls:/src:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /src/server.crt ]; then
          cp /src/server.crt /src/server.key /src/ca.crt /certs/
          chown -R 1000:1000 /certs
        fi
    restart: "no"

  opensearch-tls:
    image: opensearchproject/opensearch:2.15.0
    container_name: detector-opensearch-tls
    profiles: ["security"]
    depends_on:
      opensearch-tls-certs-init:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      # ssl_only: TLS termination without adopting full RBAC/user auth --
      # deliberately NOT full security (no securityadmin.sh bootstrap, no
      # admin_dn/nodes_dn, no OPENSEARCH_INITIAL_ADMIN_PASSWORD requirement).
      plugins.security.ssl_only: "true"
      plugins.security.ssl.http.enabled: "true"
      plugins.security.ssl.http.pemcert_filepath: certs/server.crt
      plugins.security.ssl.http.pemkey_filepath: certs/server.key
      plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt
      # Transport (node-to-node) TLS is mandatory whenever the security
      # plugin is on, even for a single node with no other nodes to talk to
      # -- reusing the same HTTP cert keeps this from needing a second pair.
      plugins.security.ssl.transport.pemcert_filepath: certs/server.crt
      plugins.security.ssl.transport.pemkey_filepath: certs/server.key
      plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
      plugins.security.ssl.transport.enforce_hostname_verification: "false"
      # The demo-config installer requires OPENSEARCH_INITIAL_ADMIN_PASSWORD
      # on 2.12+ and would also fight with our own certs -- skip it outright.
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - detector_opensearch_tls_data:/usr/share/opensearch/data
      - detector_opensearch_tls_certs:/usr/share/opensearch/config/certs:ro
    ports:
      - "127.0.0.1:9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1:9200 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: '1.5'

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: detector-qdrant
    volumes:
      - detector_qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6333/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  # AI-KB-SEMANTIC: real embedding model for SocKnowledgeRetriever's Qdrant
  # path, off by default (separate "ai-embeddings" profile, not part of the
  # default bring-up) -- opt in with `docker compose --profile ai-embeddings
  # up -d ollama`, then `docker compose exec ollama ollama pull all-minilm`
  # once (45MB, 384-dim -- matches the existing soc_knowledge Qdrant
  # collection's dimensionality already set up elsewhere in this codebase).
  ollama:
    image: ollama/ollama:latest
    container_name: detector-ollama
    profiles: ["ai-embeddings"]
    volumes:
      - detector_ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  # DATA-TIERING (cold tier): S3-compatible object storage for the archival
  # cold tier, off by default (separate "data-tiering" profile). Opt in with
  # `docker compose --profile data-tiering up -d minio`, then set
  # XDR_DATA_TIERING_COLD_TIER_ENABLED=true + AWS_ENDPOINT/AWS_BUCKET/
  # AWS_USE_PATH_STYLE_ENDPOINT=true against this instance (see
  # config/filesystems.php's existing "s3" disk, which already supports a
  # custom endpoint for S3-compatible backends). The gzip local archive
  # remains the durability guarantee regardless -- this is an additional,
  # best-effort offload target, mirroring the ClickHouse warm-tier convention.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: detector-minio
    profiles: ["data-tiering"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-detector}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-detector-minio-dev}
    volumes:
      - detector_minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  app:
    build:
      context: .
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-app
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: database
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-queue
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: database
      DB_HOST: postgres
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-scheduler
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  telemetry-worker:
    build:
      context: .
      dockerfile: infra/telemetry-worker/Dockerfile
    container_name: detector-telemetry-worker
    profiles: ["app"]
    env_file:
      - ./.env
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      SECURITY_INGEST_DSN: "host=postgres port=${DB_PORT:-5432} dbname=${DB_DATABASE:-detector} user=${DB_USERNAME:-postgres} password=${DB_PASSWORD:-postgres}"
      # ARCH-DB-SPLIT: off by default (postgres) -- zero behavior change
      # unless an operator opts in. Picked up via telemetry_stream_worker.py's
      # own --target/--clickhouse-* env-var defaults (not passed on the
      # command line below), so flipping this alone is enough to opt in.
      XDR_TELEMETRY_WRITE_TARGET: ${XDR_TELEMETRY_WRITE_TARGET:-postgres}
      XDR_CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      XDR_CLICKHOUSE_DB: ${CLICKHOUSE_DB:-detector_analytics}
      XDR_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-detector}
      XDR_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-detector}
    command: ["python3", "scripts/telemetry_stream_worker.py", "--topic", "telemetry.raw", "--bootstrap-servers", "redpanda:9092"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      # TELEMETRY-WORKER-COMMIT-AFTER-WRITE: a py_compile-only check just
      # proves the file has valid syntax, not that the running process is
      # actually consuming -- a hung/dead consumer would still report
      # healthy forever. The worker writes a heartbeat file after every
      # successful durable batch flush (or every ~1s of idle polling via
      # the bounded consumer_timeout_ms loop); a stale file means the
      # process is alive but stuck (e.g. exhausting its bounded flush
      # retries) or already dead.
      test: ["CMD-SHELL", "python3 -c \"import time,sys; p='storage/app/telemetry_worker_heartbeat'; d=open(p).read().strip() if __import__('os').path.exists(p) else None; sys.exit(0 if d and time.time()-float(d)<90 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ENT-DETECT-ML-NOT-LIVE: the rule+ML hybrid detector for HTTP-request
  # telemetry (security_events topic) — a materially different domain from
  # the identity/cloud/SaaS telemetry correlation-worker scores. Reuses the
  # same image/Dockerfile as telemetry-worker (already COPYs this script).
  # Deliberately in its own "ml-shadow" profile, NOT part of the default
  # "strangler"/"app" bring-up — `docker compose --profile ml-shadow up`
  # is a separate, explicit opt-in. --output-mode defaults to "shadow":
  # writes advisory_findings only, never security_alerts/security_responses.
  ml-shadow-detector:
    build:
      context: .
      dockerfile: infra/telemetry-worker/Dockerfile
    container_name: detector-ml-shadow-detector
    profiles: ["ml-shadow"]
    env_file:
      - ./.env
    environment:
      DB_HOST: postgres
      SECURITY_INGEST_DSN: "host=postgres port=${DB_PORT:-5432} dbname=${DB_DATABASE:-detector} user=${DB_USERNAME:-postgres} password=${DB_PASSWORD:-postgres}"
      DETECTOR_OUTPUT_MODE: ${DETECTOR_OUTPUT_MODE:-shadow}
    command:
      [
        "python3", "scripts/realtime_detector_consumer.py",
        "--rest-url", "http://redpanda:8082",
        "--topic", "security_events",
        "--group-id", "ml-shadow-detector-v1",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -m py_compile scripts/realtime_detector_consumer.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ingestion-gateway:
    build:
      context: ./services/ingestion-gateway
    container_name: detector-xdr-ingestion-gateway
    profiles: ["strangler"]
    environment:
      # Hardcoded: container-to-container must use service name, not 127.0.0.1 (host loopback).
      # .env XDR_REDPANDA_REST_URL=http://127.0.0.1:8082 is for host-side scripts only.
      XDR_REDPANDA_REST_URL: http://redpanda:8082
      # ARCH-KAFKA-NATIVE: off by default (pandaproxy) -- set XDR_KAFKA_TRANSPORT=native
      # to use the native binary Kafka protocol instead of the Pandaproxy REST proxy.
      # Plaintext stays on container port 9092; opt-in TLS uses 9093.
      XDR_KAFKA_TRANSPORT: ${XDR_KAFKA_TRANSPORT:-pandaproxy}
      XDR_REDPANDA_KAFKA_BROKERS: ${XDR_REDPANDA_KAFKA_BROKERS:-redpanda:9092}
      XDR_REDPANDA_KAFKA_TLS_ENABLED: ${XDR_REDPANDA_KAFKA_TLS_ENABLED:-false}
      XDR_REDPANDA_KAFKA_CA_CERT: ${XDR_REDPANDA_KAFKA_CA_CERT:-/etc/xdr/internal-certs/ca.crt}
      XDR_REDPANDA_KAFKA_CLIENT_CERT: ${XDR_REDPANDA_KAFKA_CLIENT_CERT:-}
      XDR_REDPANDA_KAFKA_CLIENT_KEY: ${XDR_REDPANDA_KAFKA_CLIENT_KEY:-}
      XDR_INGEST_SECRET: ${XDR_INGEST_SECRET:-dev-secret-change-me}
      XDR_RAW_TOPIC: telemetry.raw
      XDR_INGEST_RPS: 100
      XDR_MAX_BATCH_SIZE: 1000
      XDR_NORMALIZER_METRICS_URL: http://normalizer-worker:8092/metrics
      XDR_MAX_NORMALIZER_QUEUE_DEPTH: 150000
      # CONN-UNTENANTED-INGEST: reject unattributed batches outright.
      # Default false keeps local demo usable without configuring a tenant.
      XDR_INGEST_REQUIRE_TENANT: ${XDR_INGEST_REQUIRE_TENANT:-false}
      # OBS-OTEL-TRACING: OTLP span export, empty (default) disables it.
      XDR_OTEL_EXPORTER_ENDPOINT: ${XDR_OTEL_EXPORTER_ENDPOINT:-}
    ports:
      - "8091:8091"
    volumes:
      - ./storage/certs/internal-mtls:/etc/xdr/internal-certs:ro
    depends_on:
      - redpanda
    restart: unless-stopped

  normalizer-worker:
    build:
      context: ./services/normalizer-worker
    container_name: detector-xdr-normalizer-worker
    profiles: ["strangler"]
    environment:
      XDR_REDPANDA_REST_URL: http://redpanda:8082
      # ARCH-KAFKA-NATIVE: see ingestion-gateway's env block above for detail.
      XDR_KAFKA_TRANSPORT: ${XDR_KAFKA_TRANSPORT:-pandaproxy}
      XDR_REDPANDA_KAFKA_BROKERS: ${XDR_REDPANDA_KAFKA_BROKERS:-redpanda:9092}
      XDR_REDPANDA_KAFKA_TLS_ENABLED: ${XDR_REDPANDA_KAFKA_TLS_ENABLED:-false}
      XDR_REDPANDA_KAFKA_CA_CERT: ${XDR_REDPANDA_KAFKA_CA_CERT:-/etc/xdr/internal-certs/ca.crt}
      XDR_REDPANDA_KAFKA_CLIENT_CERT: ${XDR_REDPANDA_KAFKA_CLIENT_CERT:-}
      XDR_REDPANDA_KAFKA_CLIENT_KEY: ${XDR_REDPANDA_KAFKA_CLIENT_KEY:-}
      XDR_NORMALIZER_NATIVE_GROUP: ${XDR_NORMALIZER_NATIVE_GROUP:-}
      XDR_RAW_TOPIC: telemetry.raw
      XDR_NORMALIZED_TOPIC: telemetry.normalized
      XDR_NORMALIZER_DLQ_TOPIC: telemetry.normalization_failed
      XDR_NORMALIZER_GROUP: ${XDR_NORMALIZER_GROUP:-normalizer-worker-v1}
      XDR_NORMALIZER_QUEUE_DEPTH: 200000
      XDR_NORMALIZER_PRODUCER_BATCH: 100
      XDR_NORMALIZER_PRODUCERS: 16
      XDR_NORMALIZER_WORKERS: 8
      XDR_NORMALIZER_FLUSH_MS: 50
      # Internal auth enforcement. Default false keeps local demo usable without a token.
      # Set to true (+ XDR_NORMALIZER_INTERNAL_TOKEN) for non-local deployments.
      XDR_ENFORCE_INTERNAL_AUTH: ${XDR_ENFORCE_INTERNAL_AUTH:-false}
      # OBS-OTEL-TRACING: OTLP span export, empty (default) disables it.
      XDR_OTEL_EXPORTER_ENDPOINT: ${XDR_OTEL_EXPORTER_ENDPOINT:-}
    ports:
      - "8092:8092"
    volumes:
      - ./storage/certs/internal-mtls:/etc/xdr/internal-certs:ro
    depends_on:
      - redpanda
    restart: unless-stopped

  log-connector-syslog:
    build:
      context: ./services/log-connector-syslog
    container_name: detector-xdr-log-connector-syslog
    profiles: ["strangler"]
    environment:
      # Hardcoded: container-to-container must use service name, not 127.0.0.1 (host loopback).
      XDR_INGEST_URL: http://ingestion-gateway:8091/v1/ingest
      XDR_INGEST_SECRET: ${XDR_INGEST_SECRET:-dev-secret-change-me}
      XDR_SYSLOG_UDP_ADDR: ":5140"
      XDR_SYSLOG_TCP_ADDR: ":5140"
      XDR_SYSLOG_METRICS_ADDR: ":8095"
      # CONN-UNTENANTED-INGEST: deployment manifests must expose tenant
      # configuration explicitly rather than leaving it entirely absent.
      # Both default to the pre-existing behavior (unattributed telemetry).
      XDR_SYSLOG_TENANT_ID: ${XDR_SYSLOG_TENANT_ID:-}
      XDR_SYSLOG_REQUIRE_TENANT: ${XDR_SYSLOG_REQUIRE_TENANT:-false}
    ports:
      - "5140:5140/udp"
      - "5140:5140/tcp"
      - "8095:8095"
    depends_on:
      - ingestion-gateway
    restart: unless-stopped

  log-connector-cloudtrail:
    build:
      context: ./services/log-connector-cloudtrail
    container_name: detector-xdr-log-connector-cloudtrail
    profiles: ["strangler"]
    environment:
      # Hardcoded: container-to-container must use service name, not 127.0.0.1 (host loopback).
      XDR_INGEST_URL: http://ingestion-gateway:8091/v1/ingest
      XDR_INGEST_SECRET: ${XDR_INGEST_SECRET:-dev-secret-change-me}
      XDR_CLOUDTRAIL_METRICS_ADDR: ":8097"
      # CONN-UNTENANTED-INGEST: see log-connector-syslog above.
      XDR_CLOUDTRAIL_TENANT_ID: ${XDR_CLOUDTRAIL_TENANT_ID:-}
      XDR_CLOUDTRAIL_REQUIRE_TENANT: ${XDR_CLOUDTRAIL_REQUIRE_TENANT:-false}
      # CONN-UNBOUNDED-FILE: size ceilings, defaults match the Go binary's own fallbacks.
      XDR_CLOUDTRAIL_MAX_FILE_BYTES: ${XDR_CLOUDTRAIL_MAX_FILE_BYTES:-104857600}
      XDR_CLOUDTRAIL_MAX_EXPANDED_BYTES: ${XDR_CLOUDTRAIL_MAX_EXPANDED_BYTES:-524288000}
      XDR_CLOUDTRAIL_MAX_RECORD_BYTES: ${XDR_CLOUDTRAIL_MAX_RECORD_BYTES:-1048576}
    volumes:
      # Operator mounts a local sync of their CloudTrail S3 export bucket here
      # (e.g. `aws s3 sync s3://my-trail-bucket ./cloudtrail-logs` on a cron).
      - ./cloudtrail-logs:/data/cloudtrail-logs
    ports:
      - "8097:8097"
    depends_on:
      - ingestion-gateway
    restart: unless-stopped

  log-connector-guardduty:
    build:
      context: ./services/log-connector-guardduty
    container_name: detector-xdr-log-connector-guardduty
    profiles: ["strangler"]
    environment:
      # Hardcoded: container-to-container must use service name, not 127.0.0.1 (host loopback).
      XDR_INGEST_URL: http://ingestion-gateway:8091/v1/ingest
      XDR_INGEST_SECRET: ${XDR_INGEST_SECRET:-dev-secret-change-me}
      XDR_GUARDDUTY_METRICS_ADDR: ":8098"
      # CONN-UNTENANTED-INGEST: see log-connector-syslog above.
      XDR_GUARDDUTY_TENANT_ID: ${XDR_GUARDDUTY_TENANT_ID:-}
      XDR_GUARDDUTY_REQUIRE_TENANT: ${XDR_GUARDDUTY_REQUIRE_TENANT:-false}
      # CONN-UNBOUNDED-FILE: size ceilings, defaults match the Go binary's own fallbacks.
      XDR_GUARDDUTY_MAX_FILE_BYTES: ${XDR_GUARDDUTY_MAX_FILE_BYTES:-104857600}
      XDR_GUARDDUTY_MAX_EXPANDED_BYTES: ${XDR_GUARDDUTY_MAX_EXPANDED_BYTES:-524288000}
      XDR_GUARDDUTY_MAX_RECORD_BYTES: ${XDR_GUARDDUTY_MAX_RECORD_BYTES:-1048576}
    volumes:
      # Operator mounts a local sync of their GuardDuty findings-export S3 bucket here
      # (e.g. `aws s3 sync s3://my-guardduty-bucket ./guardduty-findings` on a cron).
      - ./guardduty-findings:/data/guardduty-findings
    ports:
      - "8098:8098"
    depends_on:
      - ingestion-gateway
    restart: unless-stopped

  log-connector-gcp-audit:
    build:
      context: ./services/log-connector-gcp-audit
    container_name: detector-xdr-log-connector-gcp-audit
    profiles: ["strangler"]
    environment:
      # Hardcoded: container-to-container must use service name, not 127.0.0.1 (host loopback).
      XDR_INGEST_URL: http://ingestion-gateway:8091/v1/ingest
      XDR_INGEST_SECRET: ${XDR_INGEST_SECRET:-dev-secret-change-me}
      XDR_GCP_AUDIT_METRICS_ADDR: ":8099"
      # CONN-UNTENANTED-INGEST: see log-connector-syslog above.
      XDR_GCP_AUDIT_TENANT_ID: ${XDR_GCP_AUDIT_TENANT_ID:-}
      XDR_GCP_AUDIT_REQUIRE_TENANT: ${XDR_GCP_AUDIT_REQUIRE_TENANT:-false}
      # CONN-UNBOUNDED-FILE: size ceilings, defaults match the Go binary's own fallbacks.
      XDR_GCP_AUDIT_MAX_FILE_BYTES: ${XDR_GCP_AUDIT_MAX_FILE_BYTES:-104857600}
      XDR_GCP_AUDIT_MAX_EXPANDED_BYTES: ${XDR_GCP_AUDIT_MAX_EXPANDED_BYTES:-524288000}
      XDR_GCP_AUDIT_MAX_RECORD_BYTES: ${XDR_GCP_AUDIT_MAX_RECORD_BYTES:-1048576}
    volumes:
      # Operator mounts a local sync of their GCP Cloud Audit Log sink's GCS bucket here
      # (e.g. `gcloud storage rsync gs://my-audit-log-bucket ./gcp-audit-logs` on a cron).
      - ./gcp-audit-logs:/data/gcp-audit-logs
    ports:
      - "8099:8099"
    depends_on:
      - ingestion-gateway
    restart: unless-stopped

  # CONNECTOR-FRAMEWORK phase 7: unlike the 3 connectors above (file-based
  # ingestion of already-exported logs), this polls the live Office 365
  # Management Activity API — it needs a real Azure AD app registration
  # (XDR_O365_AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET) with an active
  # subscription already started out-of-band. With no credentials
  # configured it will log auth warnings and fail to list content, but
  # still starts cleanly (matches the other connectors' "off/unconfigured
  # is safe" posture).
  log-connector-o365:
    build:
      context: ./services/log-connector-o365
    container_name: detector-xdr-log-connector-o365
    profiles: ["strangler"]
    environment:
      # Hardcoded: container-to-container must use service name, not 127.0.0.1 (host loopback).
      XDR_INGEST_URL: http://ingestion-gateway:8091/v1/ingest
      XDR_INGEST_SECRET: ${XDR_INGEST_SECRET:-dev-secret-change-me}
      XDR_O365_METRICS_ADDR: ":8100"
      XDR_O365_AZURE_TENANT_ID: ${XDR_O365_AZURE_TENANT_ID:-}
      XDR_O365_CLIENT_ID: ${XDR_O365_CLIENT_ID:-}
      XDR_O365_CLIENT_SECRET: ${XDR_O365_CLIENT_SECRET:-}
      # CONN-UNTENANTED-INGEST: see log-connector-syslog above.
      XDR_O365_TENANT_ID: ${XDR_O365_TENANT_ID:-}
      XDR_O365_REQUIRE_TENANT: ${XDR_O365_REQUIRE_TENANT:-false}
      # CONN-UNBOUNDED-FILE: size ceilings, defaults match the Go binary's own fallbacks.
      XDR_O365_MAX_CONTENT_BYTES: ${XDR_O365_MAX_CONTENT_BYTES:-104857600}
      XDR_O365_MAX_RECORD_BYTES: ${XDR_O365_MAX_RECORD_BYTES:-1048576}
    volumes:
      - o365-connector-state:/data/o365-state
    ports:
      - "8100:8100"
    depends_on:
      - ingestion-gateway
    restart: unless-stopped

  correlation-worker:
    build:
      context: ./services/correlation-worker
    container_name: detector-xdr-correlation-worker
    profiles: ["strangler"]
    environment:
      XDR_CORRELATION_GOGC: "300"
      XDR_REDPANDA_REST_URL: http://redpanda:8082
      # ARCH-KAFKA-NATIVE: see ingestion-gateway's env block for detail.
      XDR_KAFKA_TRANSPORT: ${XDR_KAFKA_TRANSPORT:-pandaproxy}
      XDR_REDPANDA_KAFKA_BROKERS: ${XDR_REDPANDA_KAFKA_BROKERS:-redpanda:9092}
      XDR_REDPANDA_KAFKA_TLS_ENABLED: ${XDR_REDPANDA_KAFKA_TLS_ENABLED:-false}
      XDR_REDPANDA_KAFKA_CA_CERT: ${XDR_REDPANDA_KAFKA_CA_CERT:-/etc/xdr/internal-certs/ca.crt}
      XDR_REDPANDA_KAFKA_CLIENT_CERT: ${XDR_REDPANDA_KAFKA_CLIENT_CERT:-}
      XDR_REDPANDA_KAFKA_CLIENT_KEY: ${XDR_REDPANDA_KAFKA_CLIENT_KEY:-}
      XDR_CORRELATION_NATIVE_GROUP: ${XDR_CORRELATION_NATIVE_GROUP:-}
      XDR_NORMALIZED_TOPIC: telemetry.normalized
      XDR_ALERTS_TOPIC: xdr.alerts
      XDR_CORRELATION_DLQ_TOPIC: xdr.alerts.dlq
      XDR_CORRELATION_FAILED_TOPIC: ${XDR_CORRELATION_FAILED_TOPIC:-xdr.correlation_failed}
      XDR_CORRELATION_GROUP: ${XDR_CORRELATION_GROUP:-correlation-worker-v1}
      XDR_CORRELATION_SCOPE: ${XDR_CORRELATION_SCOPE:-identity-cloud}
      XDR_CORRELATION_EVENT_LOOP_ENABLED: "true"
      # Internal auth enforcement — same flag shared across all services.
      # Default false keeps local demo usable without tokens.
      XDR_ENFORCE_INTERNAL_AUTH: ${XDR_ENFORCE_INTERNAL_AUTH:-false}
      XDR_CORRELATION_INTERNAL_TOKEN: ${XDR_CORRELATION_INTERNAL_TOKEN:-}
      # OBS-OTEL-TRACING: OTLP span export, empty (default) disables it.
      XDR_OTEL_EXPORTER_ENDPOINT: ${XDR_OTEL_EXPORTER_ENDPOINT:-}
    ports:
      - "8093:8093"
    volumes:
      - ./storage/certs/internal-mtls:/etc/xdr/internal-certs:ro
    depends_on:
      - redpanda
    restart: unless-stopped

  ai-rag-service:
    build:
      context: ./services/ai-rag-service
    container_name: detector-xdr-ai-rag-service
    profiles: ["strangler"]
    env_file:
      - ./.env
    environment:
      # AI-1: internal auth enforcement (same pattern as alert-writer/incident-builder)
      XDR_ENFORCE_INTERNAL_AUTH: ${XDR_ENFORCE_INTERNAL_AUTH:-false}
      XDR_AI_RAG_INTERNAL_TOKEN: ${XDR_AI_RAG_INTERNAL_TOKEN:-}
    ports:
      - "8094:8094"
    depends_on:
      - qdrant
    restart: unless-stopped

  alert-writer-service:
    build:
      context: ./services/alert-writer-service
    container_name: detector-xdr-alert-writer
    profiles: ["strangler"]
    env_file:
      - ./.env
    environment:
      SECURITY_INGEST_DSN: ${SECURITY_INGEST_DSN:-}
      DB_HOST: ${XDR_DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-detector}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      # PERF-DB-CONN-LEAK: bounded psycopg_pool.ConnectionPool sizing
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      XDR_OPENSEARCH_URL: ${XDR_OPENSEARCH_URL:-http://opensearch:9200}
      XDR_REDPANDA_REST_URL: http://redpanda:8082
      XDR_ALERTS_TOPIC: xdr.alerts
      XDR_ALERTS_CREATED_TOPIC: alerts.created
      XDR_ALERTS_DLQ_TOPIC: xdr.alerts.dlq
      XDR_ALERT_WRITE_FAILED_TOPIC: ${XDR_ALERT_WRITE_FAILED_TOPIC:-xdr.alert_write_failed}
      XDR_ALERT_WRITER_GROUP: alert-writer-v1
      XDR_EVENT_LOOP_ENABLED: "true"
      XDR_ALERT_WRITER_AUTO_OFFSET_RESET: ${XDR_ALERT_WRITER_AUTO_OFFSET_RESET:-earliest}
      # Shadow consumer — advisory findings only; does NOT produce alerts.created
      XDR_SHADOW_CONSUMER_ENABLED: ${XDR_SHADOW_CONSUMER_ENABLED:-false}
      XDR_SHADOW_ENDPOINT_TOPIC: ${XDR_SHADOW_ENDPOINT_TOPIC:-xdr.alerts.shadow.endpoint}
      XDR_SHADOW_NETWORK_TOPIC: ${XDR_SHADOW_NETWORK_TOPIC:-xdr.alerts.shadow.network}
      # DLQ consumer — normalization failures only; does NOT create incidents
      XDR_DLQ_CONSUMER_ENABLED: ${XDR_DLQ_CONSUMER_ENABLED:-false}
      XDR_DLQ_TOPIC: ${XDR_DLQ_TOPIC:-telemetry.normalization_failed}
      # Pipeline DLQ consumers — correlation/alert-write/incident-write failures; advisory, never auto-replay
      XDR_CORRELATION_DLQ_CONSUMER_ENABLED: ${XDR_CORRELATION_DLQ_CONSUMER_ENABLED:-false}
      XDR_ALERT_WRITE_DLQ_CONSUMER_ENABLED: ${XDR_ALERT_WRITE_DLQ_CONSUMER_ENABLED:-false}
      XDR_INCIDENT_WRITE_DLQ_CONSUMER_ENABLED: ${XDR_INCIDENT_WRITE_DLQ_CONSUMER_ENABLED:-false}
      XDR_INCIDENT_WRITE_FAILED_TOPIC: ${XDR_INCIDENT_WRITE_FAILED_TOPIC:-xdr.incident_write_failed}
      # Internal auth enforcement
      XDR_ENFORCE_INTERNAL_AUTH: ${XDR_ENFORCE_INTERNAL_AUTH:-false}
      XDR_ALERT_WRITER_INTERNAL_TOKEN: ${XDR_ALERT_WRITER_INTERNAL_TOKEN:-}
      # OBS-OTEL-TRACING phase 5: OTLP span export, empty (default) disables it.
      XDR_OTEL_EXPORTER_ENDPOINT: ${XDR_OTEL_EXPORTER_ENDPOINT:-}
    ports:
      - "8095:8095"
    depends_on:
      - redpanda
      - postgres
      - opensearch
    restart: unless-stopped

  incident-builder-service:
    build:
      context: ./services/incident-builder-service
    container_name: detector-xdr-incident-builder
    profiles: ["strangler"]
    env_file:
      - ./.env
    environment:
      SECURITY_INGEST_DSN: ${SECURITY_INGEST_DSN:-}
      DB_HOST: ${XDR_DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-detector}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      # PERF-DB-CONN-LEAK: bounded psycopg_pool.ConnectionPool sizing
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      XDR_REDPANDA_REST_URL: http://redpanda:8082
      XDR_ALERTS_CREATED_TOPIC: alerts.created
      XDR_INCIDENTS_TOPIC: incidents.updated
      XDR_INCIDENT_WRITE_FAILED_TOPIC: ${XDR_INCIDENT_WRITE_FAILED_TOPIC:-xdr.incident_write_failed}
      XDR_INCIDENT_BUILDER_GROUP: incident-builder-v1
      XDR_EVENT_LOOP_ENABLED: "true"
      XDR_INCIDENT_BUILDER_AUTO_OFFSET_RESET: ${XDR_INCIDENT_BUILDER_AUTO_OFFSET_RESET:-earliest}
      # Internal auth enforcement
      XDR_ENFORCE_INTERNAL_AUTH: ${XDR_ENFORCE_INTERNAL_AUTH:-false}
      XDR_INCIDENT_BUILDER_INTERNAL_TOKEN: ${XDR_INCIDENT_BUILDER_INTERNAL_TOKEN:-}
      # OBS-OTEL-TRACING phase 5: OTLP span export, empty (default) disables it.
      XDR_OTEL_EXPORTER_ENDPOINT: ${XDR_OTEL_EXPORTER_ENDPOINT:-}
    ports:
      - "8096:8096"
    depends_on:
      - redpanda
      - postgres
    restart: unless-stopped

volumes:
  detector_pgdata:
  detector_clickhouse_data:
  detector_opensearch_data:
  detector_qdrant_data:
  detector_ollama_data:
  detector_minio_data:
  detector_tempo_data:
  detector_redpanda_config:
  detector_redpanda_certs:
  detector_opensearch_tls_data:
  detector_opensearch_tls_certs:
  o365-connector-state:
