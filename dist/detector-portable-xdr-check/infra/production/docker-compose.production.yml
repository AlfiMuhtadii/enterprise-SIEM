services:
  app:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-app
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: database
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-queue
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: database
      DB_HOST: postgres
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    container_name: detector-soc-scheduler
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
    command: ["sh", "-lc", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  telemetry-worker:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile
    container_name: detector-telemetry-worker
    env_file:
      - ../../.env
    environment:
      DB_HOST: postgres
      KAFKA_REST_URL: http://redpanda:8082
    command: ["python3", "scripts/telemetry_stream_worker.py", "--topic", "telemetry_events"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -m py_compile scripts/telemetry_stream_worker.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: detector-soc-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-detector}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - detector_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-detector}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  detector_pgdata:
