apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      defaultDatabase: detector_analytics
      protocol: http
      port: 8123
      server: clickhouse
      username: detector
      tlsSkipVerify: true
      logs:
        defaultTable: security_events
      traces:
        defaultTable: security_alerts
    secureJsonData:
      password: detector
    editable: false
