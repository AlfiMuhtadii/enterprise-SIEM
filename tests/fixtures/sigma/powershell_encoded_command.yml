title: Suspicious PowerShell Encoded Command
id: 3d180a95-a350-4b6a-95e9-fbc38b6ffde3
status: stable
description: Detects PowerShell execution with base64-encoded command arguments
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: SigmaHQ
date: 2019/01/16
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\powershell.exe'
    selection_cli:
        CommandLine|contains:
            - '-enc '
            - '-EncodedCommand'
    condition: selection_img and selection_cli
falsepositives:
    - Legitimate scripts that use encoded commands
    - Administrative scripts and installers
level: high
