# docker-compose.prod.yml — Production-pilot hardening overlay
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile=strangler up -d
#
# Purpose:
#   Hardens the dev-friendly docker-compose.yml for single-region, single-node
#   production deployment. Full HA and multi-region are tracked separately
#   (see ENT-REL-SIMULATED-HA) — this overlay does not implement them yet.
#   See docs/operations/PRODUCTION_DEPLOYMENT_PROFILE.md for posture and scope.
#
# Port security posture:
#   PostgreSQL, ClickHouse, OpenSearch, Qdrant — no external port exposure
#   Grafana                                    — localhost-only (127.0.0.1:3000)
#   Redpanda Pandaproxy                        — localhost-only (127.0.0.1:8082)
#   Redpanda console                           — localhost-only (127.0.0.1:8080)
#   Redpanda Kafka OUTSIDE (19092)             — removed in production
#   app / ingestion-gateway                    — public (required for browser/agents)
#   Pipeline services (8092-8096)              — no external exposure
#
# Requires Docker Compose v2.24+ for !reset YAML tag support.

services:

  internal-mtls-certs-init:
    environment:
      XDR_INTERNAL_MTLS_ENABLED: "true"
      XDR_INTERNAL_MTLS_REQUIRED: "true"

  # ---------------------------------------------------------------------------
  # Message broker: remove Kafka external port; Pandaproxy stays localhost-only
  # ---------------------------------------------------------------------------
  redpanda:
    ports: !reset
      # Pandaproxy REST API — localhost-only; pipeline services reach it internally
      - "127.0.0.1:8082:8082"
      # Kafka OUTSIDE port 19092 removed — no direct Kafka client access in production
      # Redpanda admin port 9644 removed — accessed via docker exec or SSH tunnel only
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  redpanda-console:
    ports: !reset
      # Console UI — localhost-only; access via SSH tunnel (ssh -L 8080:localhost:8080)
      - "127.0.0.1:8080:8080"
    restart: always

  # ---------------------------------------------------------------------------
  # Data stores: no external port exposure — access via docker exec or bastion
  # ---------------------------------------------------------------------------
  postgres-tls-init:
    environment:
      POSTGRES_TLS_ENABLED: "true"
      POSTGRES_TLS_REQUIRED: "true"

  postgres:
    ports: !reset []
    environment:
      # Fail-closed: base docker-compose.yml falls back to the well-known
      # ${DB_PASSWORD:-postgres} default — refuse to start in production
      # rather than silently accepting it (ENT-SEC-WEAK-DEFAULT-SECRETS).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set to a strong value in production — see .env.production.example}
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  clickhouse-tls-init:
    environment:
      CLICKHOUSE_TLS_ENABLED: "true"
      CLICKHOUSE_TLS_REQUIRED: "true"

  clickhouse:
    ports: !reset []
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set to a strong value in production — see .env.production.example}
    restart: always
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '3.0'

  opensearch:
    ports: !reset []
    environment:
      # ENT-SEC-OPENSEARCH-OPEN: base docker-compose.yml disables the security
      # plugin for local/demo convenience (unauthenticated, unencrypted) —
      # production must explicitly enable it. Enabling it also switches the
      # HTTP layer to the bundled self-signed demo cert (https); real,
      # externally-verifiable certs are tracked separately by
      # ENT-SEC-NO-TLS-INTERNAL. See docs/operations/PRODUCTION_DEPLOYMENT_PROFILE.md.
      plugins.security.disabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD must be set to a strong value in production — see .env.production.example}
      # Audit logging (advisory trail, internal sink — no external syslog
      # needed for a single-node deployment). REST layer only: transport-layer
      # audit is very high-volume on every internal call and not needed here.
      plugins.security.audit.type: internal_opensearch
      plugins.security.audit.enable_rest: "true"
      plugins.security.audit.enable_transport: "false"
      plugins.security.audit.resolve_bulk_requests: "false"
      plugins.security.audit.log_request_body: "false"
      plugins.security.audit.config.disabled_rest_categories: "AUTHENTICATED,GRANTED_PRIVILEGES"
    volumes:
      # ENT-SEC-OPENSEARCH-OPEN: least-privilege RBAC — loaded once on first
      # boot (when the security index does not yet exist). internal_users.yml
      # is gitignored and must be generated from internal_users.yml.example;
      # roles.yml/roles_mapping.yml are committed (no secrets).
      - ./infra/opensearch/security:/usr/share/opensearch/config/opensearch-security:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  qdrant-tls-init:
    environment:
      QDRANT_TLS_ENABLED: "true"
      QDRANT_TLS_REQUIRED: "true"

  qdrant:
    ports: !reset []
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "true"
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Grafana: localhost-only + read-only provisioning mounts
  # ---------------------------------------------------------------------------
  grafana:
    ports: !reset
      # Grafana UI — localhost-only; access via SSH tunnel (ssh -L 3000:localhost:3000)
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER must be set in production — see .env.production.example}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set to a strong value in production — see .env.production.example}
    volumes:
      # Production: provisioning and dashboards are read-only to prevent drift
      - ./infra/analytics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/analytics/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Laravel SOC application: restart always; port 8000 public (browser access)
  # ---------------------------------------------------------------------------
  app:
    environment:
      XDR_CLICKHOUSE_HTTP_URL: https://clickhouse:8443
      XDR_CLICKHOUSE_VERIFY_TLS: "true"
      XDR_CLICKHOUSE_CA_CERT: /etc/xdr/clickhouse-certs/ca.crt
      SOC_QDRANT_BASE_URL: https://qdrant:6333
      XDR_QDRANT_URL: https://qdrant:6333
      XDR_QDRANT_VERIFY_TLS: "true"
      XDR_QDRANT_CA_CERT: /etc/xdr/qdrant-certs/ca.crt
      XDR_INTERNAL_MTLS_ENABLED: "true"
      XDR_AI_RAG_SERVICE_URL: https://ai-rag-service:8094
      XDR_CORRELATION_WORKER_URL: https://correlation-worker:8093
    restart: always

  queue:
    environment:
      XDR_CLICKHOUSE_HTTP_URL: https://clickhouse:8443
      XDR_CLICKHOUSE_VERIFY_TLS: "true"
      XDR_CLICKHOUSE_CA_CERT: /etc/xdr/clickhouse-certs/ca.crt
      SOC_QDRANT_BASE_URL: https://qdrant:6333
      XDR_QDRANT_URL: https://qdrant:6333
      XDR_QDRANT_VERIFY_TLS: "true"
      XDR_QDRANT_CA_CERT: /etc/xdr/qdrant-certs/ca.crt
      XDR_INTERNAL_MTLS_ENABLED: "true"
      XDR_AI_RAG_SERVICE_URL: https://ai-rag-service:8094
      XDR_CORRELATION_WORKER_URL: https://correlation-worker:8093
    restart: always

  scheduler:
    environment:
      XDR_CLICKHOUSE_HTTP_URL: https://clickhouse:8443
      XDR_CLICKHOUSE_VERIFY_TLS: "true"
      XDR_CLICKHOUSE_CA_CERT: /etc/xdr/clickhouse-certs/ca.crt
      SOC_QDRANT_BASE_URL: https://qdrant:6333
      XDR_QDRANT_URL: https://qdrant:6333
      XDR_QDRANT_VERIFY_TLS: "true"
      XDR_QDRANT_CA_CERT: /etc/xdr/qdrant-certs/ca.crt
      XDR_INTERNAL_MTLS_ENABLED: "true"
      XDR_AI_RAG_SERVICE_URL: https://ai-rag-service:8094
      XDR_CORRELATION_WORKER_URL: https://correlation-worker:8093
    restart: always

  telemetry-worker:
    environment:
      SECURITY_INGEST_DSN: "host=postgres port=${DB_PORT:-5432} dbname=${DB_DATABASE:-detector} user=${DB_USERNAME:-postgres} password=${DB_PASSWORD:?DB_PASSWORD must be set to a strong value in production} sslmode=verify-full sslrootcert=/etc/xdr/postgres-certs/ca.crt sslcert=/etc/xdr/postgres-certs/client.crt sslkey=/etc/xdr/postgres-certs/client.key"
      XDR_CLICKHOUSE_HTTP_URL: https://clickhouse:8443
      XDR_CLICKHOUSE_VERIFY_TLS: "true"
      XDR_CLICKHOUSE_CA_CERT: /etc/xdr/clickhouse-certs/ca.crt

  ml-shadow-detector:
    environment:
      SECURITY_INGEST_DSN: "host=postgres port=${DB_PORT:-5432} dbname=${DB_DATABASE:-detector} user=${DB_USERNAME:-postgres} password=${DB_PASSWORD:?DB_PASSWORD must be set to a strong value in production} sslmode=verify-full sslrootcert=/etc/xdr/postgres-certs/ca.crt sslcert=/etc/xdr/postgres-certs/client.crt sslkey=/etc/xdr/postgres-certs/client.key"

  # ---------------------------------------------------------------------------
  # Pipeline services: enforce internal auth; advisory-only consumer posture
  # ---------------------------------------------------------------------------
  ingestion-gateway:
    environment:
      # Internal auth must be enforced in production — fail fast if token missing
      XDR_ENFORCE_INTERNAL_AUTH: "true"
    restart: always

  normalizer-worker:
    ports: !reset []
    environment:
      XDR_ENFORCE_INTERNAL_AUTH: "true"
    restart: always

  correlation-worker:
    ports: !reset []
    environment:
      XDR_ENFORCE_INTERNAL_AUTH: "true"
      XDR_INTERNAL_MTLS_ENABLED: "true"
    restart: always

  alert-writer-service:
    ports: !reset []
    environment:
      XDR_ENFORCE_INTERNAL_AUTH: "true"
      # Shadow and DLQ consumers disabled in production — advisory-only, operator-triggered
      XDR_SHADOW_CONSUMER_ENABLED: "false"
      XDR_DLQ_CONSUMER_ENABLED: "false"
      XDR_CORRELATION_DLQ_CONSUMER_ENABLED: "false"
      XDR_ALERT_WRITE_DLQ_CONSUMER_ENABLED: "false"
      # ENT-SEC-OPENSEARCH-OPEN: security plugin enabled in production — connect
      # over https and authenticate; verify=false is required against the
      # bundled self-signed demo cert (see opensearch service comment above).
      # Least-privilege: this service authenticates as xdr_alert_writer
      # (index-only role), a distinct account from Laravel's read-only
      # xdr_reader — never the admin superuser (see infra/opensearch/security/).
      XDR_OPENSEARCH_URL: https://opensearch:9200
      XDR_OPENSEARCH_USER: ${XDR_OPENSEARCH_WRITER_USER:?XDR_OPENSEARCH_WRITER_USER must be set in production — see .env.production.example}
      XDR_OPENSEARCH_PASSWORD: ${XDR_OPENSEARCH_WRITER_PASSWORD:?XDR_OPENSEARCH_WRITER_PASSWORD must be set to a strong value in production — see .env.production.example}
      XDR_OPENSEARCH_VERIFY_TLS: "false"
    restart: always

  incident-builder-service:
    ports: !reset []
    environment:
      XDR_ENFORCE_INTERNAL_AUTH: "true"
    restart: always

  ai-rag-service:
    ports: !reset []
    environment:
      # AI-1: was completely unauthenticated -- now enforced in production
      # like every other internal service in this file.
      XDR_ENFORCE_INTERNAL_AUTH: "true"
      XDR_INTERNAL_MTLS_ENABLED: "true"
    restart: always
