# Production OTLP/HTTP receiver TLS. Tempo's query/readiness API remains HTTP
# on the internal Docker network for Grafana and health checks.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
          tls:
            cert_file: /etc/xdr/internal-mtls/server.crt
            key_file: /etc/xdr/internal-mtls/server.key
            min_version: "1.2"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
