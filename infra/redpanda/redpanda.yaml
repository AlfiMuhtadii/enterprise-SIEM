# ENT-SEC-NO-TLS-INTERNAL: additive Pandaproxy and native Kafka TLS.
#
# Listener addresses, node ID, and resource flags remain in docker-compose.yml.
# Per-listener TLS policies live here because Redpanda has no equivalent CLI
# flag. Both APIs retain their plaintext listeners; TLS is additive and opt-in.
pandaproxy:
  pandaproxy_api:
    - name: internal
      address: 0.0.0.0
      port: 8082
    - name: external_tls
      address: 0.0.0.0
      port: 8083
  advertised_pandaproxy_api:
    - name: internal
      address: redpanda
      port: 8082
    - name: external_tls
      address: redpanda
      port: 8083
  pandaproxy_api_tls:
    - name: external_tls
      enabled: true
      # Server-side TLS only -- no client certificate required. Matches this
      # session's convention of additive, low-friction opt-in over forcing a
      # full mTLS cutover on infrastructure Go/Python clients don't already
      # have mTLS wiring for.
      require_client_auth: false
      cert_file: /etc/redpanda-certs/server.crt
      key_file: /etc/redpanda-certs/server.key

redpanda:
  kafka_api_tls:
    - name: INTERNAL_TLS
      enabled: true
      require_client_auth: false
      cert_file: /etc/redpanda-certs/server.crt
      key_file: /etc/redpanda-certs/server.key
    - name: OUTSIDE_TLS
      enabled: true
      require_client_auth: false
      cert_file: /etc/redpanda-certs/server.crt
      key_file: /etc/redpanda-certs/server.key
