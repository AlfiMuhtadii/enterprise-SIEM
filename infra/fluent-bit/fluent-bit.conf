[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /logs/security.jsonl
    Tag               security.events
    Parser            json
    DB                /fluent-bit/tail-state.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  1

[FILTER]
    Name         modify
    Match        security.events
    Add          pipeline fluent-bit

[OUTPUT]
    Name                    kafka
    Match                   security.events
    Brokers                 redpanda:9092
    Topics                  security_events
    Format                  json
    Timestamp_Key           ts
    Retry_Limit             False
    rdkafka.request.required.acks 1
