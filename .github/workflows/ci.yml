name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP / Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: detector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d detector_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none

      - name: Setup Python for cross-runtime contract tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Cache Composer packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          {
            echo "APP_ENV=testing"
            echo "APP_DEBUG=false"
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=detector_test"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=postgres"
            echo "QUEUE_CONNECTION=database"
          } >> .env

      - name: PHP syntax lint
        run: git ls-files "*.php" | xargs -n 1 php -l

      - name: Route cache validation
        run: |
          php artisan route:cache
          php artisan route:clear

      # No manual migrate:fresh: phpunit.xml pins DB_DATABASE=detector_test and
      # RefreshDatabase migrates it fresh once at suite start (a manual migrate here
      # would double-migrate — see docs/guides/TESTING.md / claude.md test-database section).
      - name: Run Laravel tests
        run: php artisan test

  static-analysis:
    name: PHP / Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Style is incremental until historical formatting debt is normalized.
      # PHPStan remains a full-repository baseline-aware gate.
      - name: Pint (changed PHP files)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base_sha="$BEFORE_SHA"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          mapfile -d '' php_files < <(
            git diff --name-only --diff-filter=ACMRT -z "$base_sha" HEAD -- '*.php'
          )
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "No changed PHP files require Pint validation."
            exit 0
          fi
          ./vendor/bin/pint --test "${php_files[@]}"

      - name: PHPStan / Larastan
        run: ./vendor/bin/phpstan analyse --no-progress --no-interaction --memory-limit=1G

  frontend:
    name: Frontend / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-build
          path: public/build/
          if-no-files-found: error
          retention-days: 7

  python-tests:
    name: Python / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPYCACHEPREFIX: /tmp/xdr-pycache
    strategy:
      fail-fast: false
      matrix:
        suite:
          - endpoint_agent
          - alert_writer
          - incident_builder
          - ai_rag
          - scripts
          - xdr_topic_bootstrap
          - demo_feed
          - demo_causal_verify

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --quiet requests==2.34.2
          case "${{ matrix.suite }}" in
            alert_writer)
              python -m pip install --quiet -r services/alert-writer-service/requirements.txt
              ;;
            incident_builder)
              python -m pip install --quiet -r services/incident-builder-service/requirements.txt
              ;;
          esac

      - name: Compile first-party Python
        run: python -m compileall -q scripts services

      - name: Run Python suite
        run: python -m unittest discover -s tests/${{ matrix.suite }} -p "test_*.py" -v

  go-tests:
    name: Go / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/ingestion-gateway
          - services/normalizer-worker
          - services/correlation-worker
          - services/log-connector-syslog
          - services/log-connector-cloudtrail
          - services/log-connector-guardduty
          - services/log-connector-gcp-audit
          - services/log-connector-o365
          - tools/attack-simulator
          - tools/xdr-scenario-runner
          - tools/shared-go/mtls
          - tools/shared-go/deliver
          - tools/shared-go/kafkanative

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: |
            services/ingestion-gateway/go.sum
            services/normalizer-worker/go.sum
            services/correlation-worker/go.sum
            tools/attack-simulator/go.sum
            tools/xdr-scenario-runner/go.sum

      - name: Run Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Run Go tests with race detector
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  governance:
    name: Contracts / Governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPYCACHEPREFIX: /tmp/xdr-pycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate shared runtime helper drift
        run: |
          python -m compileall -q tools/shared-python/service-adapters
          python scripts/xdr_shared_go_package_drift_validate.py

      - name: Validate workflow action pinning
        run: python scripts/xdr_ci_workflow_validate.py --output reports/ci_workflow_validation.json

      - name: Validate environment profiles
        run: |
          python scripts/validate_environment.py --profile local --env-file .env.example
          python scripts/validate_environment.py --profile production --env-file .env.production.example --allow-placeholders

      - name: Validate detection registry
        run: python scripts/xdr_rule_registry_validate.py

      - name: Validate XDR contracts
        run: python scripts/xdr_contract_validate.py --output reports/ci_xdr_contract_validation.json

      - name: Validate fleet simulation
        run: python scripts/xdr_fleet_simulation_validate.py

      - name: Portable export validation
        run: python scripts/export_portable_detector.py --output dist/detector-portable-ci --clean

      - name: Real-world sample adapter validation
        run: |
          python scripts/telemetry_adapters.py --adapter sysmon-json --input samples/real-world/sysmon_sample.jsonl --output storage/logs/ci_sysmon.jsonl
          python scripts/telemetry_adapters.py --adapter zeek-conn --input samples/real-world/zeek_conn.log --output storage/logs/ci_zeek_conn.jsonl
          python scripts/telemetry_adapters.py --adapter suricata-eve --input samples/real-world/suricata_eve.jsonl --output storage/logs/ci_suricata.jsonl
          python scripts/telemetry_event_contract.py --file storage/logs/ci_sysmon.jsonl
          python scripts/telemetry_enrichment.py --input storage/logs/ci_sysmon.jsonl --output storage/logs/ci_sysmon_enriched.jsonl
          python scripts/threat_hunt.py --jsonl storage/logs/ci_sysmon_enriched.jsonl --output reports/ci_threat_hunt.json

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: governance-evidence
          path: |
            reports/*.json
            storage/logs/ci_*.jsonl
          if-no-files-found: warn
          retention-days: 14

  compose-image:
    name: Compose / Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPYCACHEPREFIX: /tmp/xdr-pycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build frontend assets for image context
        run: |
          npm ci
          npm run build

      - name: Validate current Compose topology
        run: |
          cp .env.production.example .env
          docker compose config --quiet
          python scripts/xdr_kafka_tls_compose_validate.py --output reports/ci_kafka_tls_compose_validation.json
          python scripts/xdr_postgres_tls_compose_validate.py --output reports/ci_postgres_tls_compose_validation.json
          python scripts/xdr_clickhouse_tls_compose_validate.py --output reports/ci_clickhouse_tls_compose_validation.json
          python scripts/xdr_qdrant_tls_compose_validate.py --output reports/ci_qdrant_tls_compose_validation.json
          python scripts/xdr_ai_rag_mtls_compose_validate.py
          docker compose --env-file .env.production.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose --env-file .env.production.example -f infra/production/docker-compose.production.yml config --quiet

      - name: Build current production application image
        run: docker compose --project-name detector-ci --profile app build app

      - name: Production image vulnerability scan
        run: |
          APP_IMAGE_ID="$(docker image inspect --format '{{.Id}}' detector-ci-app)"
          test -n "$APP_IMAGE_ID"
          python scripts/xdr_container_image_scan.py --image "$APP_IMAGE_ID" --output reports/ci_container_image_scan.json

      - name: Upload image scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-image-scan
          path: reports/ci_container_image_scan.json
          if-no-files-found: warn
          retention-days: 14

  required-gate:
    name: Required Gate
    if: ${{ always() }}
    needs:
      - php-tests
      - static-analysis
      - frontend
      - python-tests
      - go-tests
      - governance
      - compose-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all CI groups passed
        env:
          PHP_TESTS_RESULT: ${{ needs.php-tests.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
          GO_TESTS_RESULT: ${{ needs.go-tests.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          COMPOSE_IMAGE_RESULT: ${{ needs.compose-image.result }}
        run: |
          failed=0
          for variable in \
            PHP_TESTS_RESULT \
            STATIC_ANALYSIS_RESULT \
            FRONTEND_RESULT \
            PYTHON_TESTS_RESULT \
            GO_TESTS_RESULT \
            GOVERNANCE_RESULT \
            COMPOSE_IMAGE_RESULT
          do
            result="${!variable}"
            printf '%s=%s\n' "$variable" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
