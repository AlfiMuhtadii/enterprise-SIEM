name: security-scan

# CI-SAST-DEPSCAN (remaining scope after dependabot): static analysis + filesystem
# vulnerability/secret/misconfig scanning. All jobs are ADVISORY on first rollout —
# they upload results to the GitHub code-scanning (Security) tab and never fail the
# build, so existing findings don't block development. Ratchet to blocking later.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a push.
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CodeQL deep dataflow SAST for the languages it supports here. PHP is not a
  # CodeQL language — it is covered by the Semgrep job below instead.
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"

  # Semgrep covers PHP + Go (and reinforces Python/JS) with security rulesets.
  semgrep:
    name: Semgrep SAST (PHP / Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --quiet semgrep

      - name: Run Semgrep (advisory)
        run: |
          semgrep scan \
            --config=p/php \
            --config=p/golang \
            --config=p/security-audit \
            --config=p/secrets \
            --sarif --output=semgrep.sarif \
            --metrics=off || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Trivy filesystem scan — dependency CVEs + secrets + IaC misconfig. Reuses the
  # exact digest-pinned Trivy the repo already standardized on for image scanning.
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy filesystem scan (advisory)
        run: |
          docker run --rm -v "$PWD:/repo" \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format sarif --output /repo/trivy-fs.sarif \
            --exit-code 0 /repo

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
